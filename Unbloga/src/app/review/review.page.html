<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/manga"></ion-back-button>
    </ion-buttons>
    <ion-title>Review</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="guardar()">
        <i class="bi bi-check2"></i>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>


<ion-content [fullscreen]="true">
  <ion-card>
  <ion-card-content>
    <ion-list>
      <ion-item>
        <ion-thumbnail slot="start">
          <img alt="Silhouette of mountains" src="assets/vagabong.webp" />
        </ion-thumbnail>
        <ion-label>Vagabond</ion-label>
      </ion-item>

      <ion-item>
        
        <ion-label>Date</ion-label>
      </ion-item>
      <ion-item>
        
        <div class="rating-content">
          <app-star-rate 
            [selected]="rating" 
            (selectedChange)="onRatingChanged($event)">
          </app-star-rate>
          <ion-item button (click)="darLike()" lines="none" class="like-item">
              <div class="like-content">
                <i *ngIf="like" class="bi bi-heart-fill"></i>
                <i *ngIf="!like" class="bi bi-heart"></i>
                <span>Like</span>
              </div>
            </ion-item>
        </div>
      </ion-item>

      
      <ion-item>
    <ion-textarea style="height: 100px;" label="Comentario" labelPlacement="floating" placeholder="Agrega una review"></ion-textarea>
  </ion-item>
    </ion-list>
  </ion-card-content>
</ion-card>
</ion-content>
