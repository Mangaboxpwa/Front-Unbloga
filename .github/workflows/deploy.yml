name: Despliegue de Angular (Build Remoto SSH con git pull)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy_angular:
    runs-on: ubuntu-latest
    name: Deploy Angular Project

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Ejecutar comandos SSH para Build & Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            echo "== Accediendo al directorio del proyecto =="
            cd ${{ secrets.WORK_DIR }}

            git config --global --add safe.directory "${{ secrets.WORK_DIR }}"

            echo "== Descargando últimos cambios =="
            git fetch origin main
            git reset --hard origin/main

            echo "== Instalando dependencias =="
            sudo rm -rf node_modules
            sudo npm install --legacy-peer-deps
            sudo npm update
            
            echo "== Instalando Ionic CLI =="
            sudo npm install -g @ionic/cli

            echo "== Limpiando carpeta www existente =="
            sudo rm -rf www

            echo "== Compilando Angular/Ionic para producción =="
            sudo ionic build --prod

            echo "== Ajustando permisos para israel y nginx =="

            # israel dueño total
            sudo chown -R israel:israel ${{ secrets.WORK_DIR }}

            # Permisos generales de lectura/escritura/ejecución
            sudo chmod -R 775 ${{ secrets.WORK_DIR }}

            # Permisos ACL para nginx (lectura + escritura permanente)
            sudo setfacl -R -m u:nginx:rwx ${{ secrets.WORK_DIR }}
            sudo setfacl -dR -m u:nginx:rwx ${{ secrets.WORK_DIR }}

            echo "== Reiniciando Nginx =="
            sudo systemctl restart nginx

            echo "== Deploy completado correctamente =="
