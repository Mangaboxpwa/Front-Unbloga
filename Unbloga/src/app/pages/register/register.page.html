<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button (click)="goBack()"></ion-back-button>
    </ion-buttons>
    <ion-title>
      Register
    </ion-title>
    <ion-progress-bar *ngIf="btnUndefined" type="indeterminate"></ion-progress-bar>
  </ion-toolbar>
</ion-header>

<ion-content>
<ng-container>
  <div class="container"style="margin: 0;
  padding: 0;">
    
    <!-- Arriba: Imagen de fondo -->
    <div class="top-section" ></div>

    <!-- Abajo: dividido en 3 partes -->
    <div class="bottom-section">
      
      <!-- Sección 1: Imagen centrada -->
      <div class="topp-section">
        <h1>Unete a Unbloga</h1>
      </div>

      <!-- Sección 2: Botones -->
      <div class="middle-section" >

        <form class="formulario" [formGroup]="RegistrarForm">
        <!-- EMAIL -->
<ion-item style="width: 100%; margin-bottom:5px">
  <ion-input 
    label="Correo"
    formControlName="email"
    labelPlacement="floating">
  </ion-input>

  
</ion-item>
<ion-note *ngIf="backendErrors?.email?.[0]" slot="error" color="danger">
  {{ backendErrors?.email?.[0] }}
</ion-note>
<!-- NAME -->
<ion-item style="width: 100%; margin-bottom:5px">
  <ion-input 
    label="Nombre"
    formControlName="name"
    labelPlacement="floating">
  </ion-input>

  
</ion-item>
<ion-note *ngIf="backendErrors?.name?.[0]" slot="error" color="danger">
  {{ backendErrors?.name?.[0] }}
</ion-note>
<!-- PASSWORD -->
<ion-item style="width: 100%; margin-bottom:5px">
  <ion-input 
    type="password"
    formControlName="password"
    label="Contraseña"
    labelPlacement="floating">
  </ion-input>

  
</ion-item>

<!-- PASSWORD CONFIRMATION -->
<ion-item style="width: 100%; margin-bottom:5px">
  <ion-input
    type="password"
    formControlName="password_confirmation"
    label="Repetir contraseña"
    labelPlacement="floating">
  </ion-input>

  
</ion-item>
<ion-note *ngIf="backendErrors?.password?.[0]" slot="error" color="danger">
  {{ backendErrors?.password?.[0] }}
</ion-note>

        <div class="button-row">
          <ion-button shape="round" (click)="goLogin()">Inicia sesión</ion-button>
          <ion-button shape="round" [disabled]="btnUndefined" (click)="enviarRegistro()">Ir</ion-button>
        </div>
        <ion-alert
          [isOpen]="isAlertOpen"
          [header]="headerAlert"
          [subHeader]="subHeader"
          [message]="message"
          [buttons]="alertButtons"
          (didDismiss)="setOpen(false)"
        ></ion-alert>
       
        <hr />
        </form>
      </div>

      <!-- Sección 3: Label -->
      <div class="bottomm-section">
        <label>Artwork from Vagabond</label>
      </div>
      
    </div>
  </div>
</ng-container>

</ion-content>
