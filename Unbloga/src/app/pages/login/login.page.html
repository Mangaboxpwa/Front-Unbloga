<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button fill="clear" (click)="goBack()">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>
      Login
    </ion-title>
    <ion-progress-bar *ngIf="btnUndefined" type="indeterminate"></ion-progress-bar>
  </ion-toolbar>
</ion-header>

<ion-content>
<ng-container>
  <div class="container"style="margin: 0;
  padding: 0;">
    
    <!-- Arriba: Imagen de fondo -->
    <div class="top-section" ></div>

    <!-- Abajo: dividido en 3 partes -->
    <div class="bottom-section">
      
      <!-- Sección 1: Imagen centrada -->
      <div class="topp-section">
        <h1>Inicia sesión</h1>
      </div>

      <!-- Sección 2: Botones -->
      <div class="middle-section">
        <form class="formulario" [formGroup]="LoginForm">
          <ion-item style="width: 100%; margin-bottom:5px">
            <ion-input label="Email" formControlName="email" labelPlacement="floating" placeholder=""></ion-input>
          </ion-item>
          <div *ngIf="LoginForm.get('email')?.touched && LoginForm.get('email')?.errors?.['required']">
              <small style="color:red">El email es obligatorio.</small>
            </div>
            <div *ngIf="LoginForm.get('email')?.touched && LoginForm.get('email')?.errors?.['email']">
              <small style="color:red">Ingrese un email valido.</small>
            </div>
          <ion-item style="width: 100%;">
            <ion-input type="password" label="Contraseña" formControlName="password" labelPlacement="floating"></ion-input>
          </ion-item> 
          <div *ngIf="LoginForm.get('password')?.touched && LoginForm.get('password')?.errors?.['required']">
              <small style="color:red">La contraseña es obligatoria.</small>
            </div>
          <ion-item>
            <app-captcha  style="margin-top:10px" (resolved)="onCaptchaResolved($event)"></app-captcha>
          </ion-item>
          <div *ngIf="LoginForm.get('captcha')?.touched && LoginForm.get('captcha')?.invalid">
              <small style="color:red">Por favor completa el captcha.</small>
            </div>
            <div *ngIf="backendErrors">
              <small style="color:red">Credenciales incorrectas.</small>
            </div>
          <div class="button-row">
            <ion-button shape="round" (click)="goRegister()">Únete</ion-button>
            <ion-button shape="round" (click)="recuperarContrasena()">Resetear contraseña</ion-button>
            <ion-button shape="round" [disabled]="btnUndefined" (click)="enviarLogin()">Ir</ion-button>
          </div>
        </form>
        <hr />
      </div>
      <ion-alert
          [isOpen]="isAlertOpen"
          [header]="headerAlert"
          [subHeader]="subHeader"
          [message]="message"
          [buttons]="alertButtons"
          (didDismiss)="setOpen(false)"
        ></ion-alert>
      
      
    </div>
  </div>
</ng-container>
</ion-content>
