<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Perfil
    </ion-title>
    <ion-buttons slot="end">
      <ion-button id="open-action-sheet">
        <i class="bi bi-share-fill"></i>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
<ng-container *ngIf="!isLoggedIn; else perfilContent">
  <div class="container"style="margin: 0;
  padding: 0;">

    <!-- Arriba: Imagen de fondo -->
    <div class="top-section" ></div>

    <!-- Abajo: dividido en 3 partes -->
    <div class="bottom-section">

      <!-- Sección 1: Imagen centrada -->
      <div class="topp-section">
        <img src="assets/Letterboxd-Logo.png" alt="Logo" />
      </div>

      <!-- Sección 2: Botones -->
      <div class="middle-section">
        <hr />
        <ion-button fill="clear" expand="block" (click)="goLogin()">Iniciar sesión</ion-button>
        <ion-button fill="clear" expand="block" (click)="goRegister()">Registrarse</ion-button>
        <hr />
      </div>

      <!-- Sección 3: Label -->
      <div class="bottomm-section">
        <label>Artwork from Vagabond</label>
      </div>

    </div>
  </div>
</ng-container>


  <ng-template #perfilContent>
  <ion-list>
  <ion-item >
    <div class="avatar-wrapper">
    <ion-avatar>
      <img alt="Silhouette of a person's head" [src]="User?.avatar_url" />
    </ion-avatar>
  </div>
  </ion-item>
  <!-- Favoritos -->
  <ion-item>
    <ion-label position="stacked">
    <h1 class="title">Favoritos</h1>
  </ion-label>
    <ion-row class="tight-row" style="width: 100%;">
      <ion-col *ngFor="let favorite of Favorites?.slice(0,4)"  size="3" size-lg="3">
        <a [routerLink]="['/manga', favorite.manga.id]">
        <ion-card>
          <img [src]="favorite.manga.cover_url" />
        </ion-card>
        </a>
      </ion-col>
    </ion-row>
  </ion-item>
  <!-- Reseñas recientes -->
  <ion-item>
    <ion-label position="stacked">
    <h1 class="title">Actividad reciente</h1>
  </ion-label>
    <ion-row class="tight-row" style="width: 100%;">
      <ion-col *ngFor="let review of Reviews?.slice(0,4)"  size="3" size-lg="3">
        <a [routerLink]="['/manga', review.manga.id]">
        <ion-card>
          <img [src]="review.manga.cover_url" />
        </ion-card>
        </a>
      </ion-col>
    </ion-row>
  </ion-item>
  
<!-- Tercera sección -->
<ion-list lines="none">

  <ion-item button [routerLink]="['/reviews']">
    <ion-label>Reviews</ion-label>

    <ion-badge slot="end" color="none">{{Reviews?.length}}</ion-badge>
    <i class="bi bi-chevron-right" slot="end"></i>
  </ion-item>

  <ion-item button [routerLink]="['/favorites']">
    <ion-label>Favoritos</ion-label>

    <ion-badge slot="end" color="none">{{this.Favorites?.length}}</ion-badge>
    <i class="bi bi-chevron-right" slot="end"></i>
  </ion-item>

  <ion-item button [routerLink]="['/network']">
    <ion-label>Siguiendo</ion-label>

    <ion-badge slot="end" color="none">{{this.User?.following?.length}}</ion-badge>
    <i class="bi bi-chevron-right" slot="end"></i>
  </ion-item>

  <ion-item button [routerLink]="['/network']">
    <ion-label>Seguidores</ion-label>

    <ion-badge slot="end" color="none">{{this.User?.followers?.length}}</ion-badge>
    <i class="bi bi-chevron-right" slot="end"></i>
  </ion-item>

</ion-list>

</ion-list>



<ion-button (click)="logout()">Cerrar sesión</ion-button>
<ion-action-sheet
trigger="open-action-sheet"  
[header]="User?.name"
  [buttons]="actionSheetButtons"
></ion-action-sheet>
<ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
</ion-refresher>
  
<ion-toast trigger="open-toast" message="Enlace copiado" [duration]="3000"></ion-toast>
  </ng-template>
</ion-content>
