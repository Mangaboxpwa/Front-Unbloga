name: Despliegue de Angular (Build Remoto SSH con git pull)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy_angular:
    runs-on: ubuntu-latest
    name: Deploy Angular Project

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute remote ssh commands (Build & Deploy)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            echo "== Configurando SSH en el servidor =="
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh

            # Cargar la llave Deploy-ssh
            echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/Deploy-ssh
            chmod 600 ~/.ssh/Deploy-ssh
            eval "$(ssh-agent -s)"
            ssh-add ~/.ssh/Deploy-ssh

            # Agregar GitHub a known_hosts
            ssh-keyscan github.com >> ~/.ssh/known_hosts
            chmod 644 ~/.ssh/known_hosts

            echo "== Accediendo al directorio del proyecto =="
            cd ${{ secrets.WORK_DIR }}

            git config --global --add safe.directory "${{ secrets.WORK_DIR }}"

            echo "== Descargando últimos cambios del repositorio =="
            sudo git pull origin main

            echo "== Instalando dependencias de Node.js =="
            sudo rm -rf node_modules
            sudo npm install --legacy-peer-deps

            echo "== Limpiando carpeta www existente =="
            sudo rm -rf www

            echo "== Construyendo Angular para producción =="
            sudo npm run build --prod

            echo "== Corrigiendo permisos para Nginx =="
            sudo chown -R nginx:nginx ${{ secrets.WORK_DIR }}
            sudo chmod -R 755 ${{ secrets.WORK_DIR }}
            sudo chcon -Rt httpd_sys_content_t ${{ secrets.WORK_DIR }}

            echo "== Reiniciando Nginx =="
            sudo systemctl restart nginx

            echo "== Deploy completado correctamente =="
