<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Home</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Home</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-grid style="margin-left: 5%; margin-right: 5%;">
    <!-- Bienvenida -->
    <ion-row class="ion-justify-content-center ion-align-items-center" style="height: 100px;">
      <ion-col size="12" class="ion-text-center">
        <h3>Bienvenido te quiero mucho. Aquí tienes lo que han visto tus seguidos...</h3>
      </ion-col>
    </ion-row>

    <!-- NUEVO DE SEGUIDOS -->
    <ion-row *ngIf="resenas.length > 0" class="ion-align-items-center ion-margin-bottom">
      <ion-col size="6">
        <p>Nuevo de seguidos</p>
      </ion-col>
      <ion-col size="6" class="ion-text-end">
        <a href=""><b><ion-icon name="flash"></ion-icon>Toda actividad</b></a>
      </ion-col>
    </ion-row>
    <div style="height:1px; background-color:#ccc; width:100%; margin:10px 0;"></div>

    <ion-row>
      <ion-col *ngFor="let resena of resenas.slice(0,6)" [routerLink]="['/reviews/',resena.users.id]" size="6" size-lg="2">
        <ion-card>
          <img [src]="resena.manga.cover_url" />
          <ion-card-content style="padding: 0;">
            <div style="background-color: #735ba6; color: white; width: 100%; padding: 8px ; padding-left: 2px;">
               {{resena.users.name}}
            </div>
          
            <ion-row style="margin: 0; padding: 0;">
              <ion-col size="6" style="padding-left: 0; display: flex; gap: 5px; align-items: center;">
                <i *ngIf="resena.is_favorite" class="bi bi-heart-fill"></i>
                <i *ngIf="resena.review" class="bi bi-file-text"></i>
              
              </ion-col>
              <ion-col size="6" style=" text-align: end;">
                <b>{{formatoFecha(resena.created_at)}}</b>
              </ion-col>
            </ion-row>
          </ion-card-content>
        </ion-card>

      </ion-col>
      <!-- Copia más ion-col para más cards -->
    </ion-row>

    <!-- POPULAR EN UNBLOGA -->
    <ion-row class="ion-align-items-center ion-margin-bottom ion-margin-top">
      <ion-col size="6">
        <p>Popular en Unbloga</p>
      </ion-col>
      <ion-col size="6" class="ion-text-end">
        <a href=""><b>Más</b></a>
      </ion-col>
    </ion-row>
    <div style="height:1px; background-color:#ccc; width:100%; margin:10px 0;"></div>

    <ion-row>
      <ion-col *ngFor="let manga of mangas?.slice(0,6)" size="6" size-lg="2">
        <a [routerLink]="['/manga', manga.id]">
          <ion-card>
            <img [src]="manga.cover_url" />
          </ion-card>
        </a>
      </ion-col>
    </ion-row>

    <!-- REVIEWS POPULARES EN UNBLOGA -->
    <ion-row class="ion-align-items-center ion-margin-bottom ion-margin-top">
      <ion-col size="6">
        <p>Los favoritos en Unbloga</p>
      </ion-col>
      <ion-col size="6" class="ion-text-end">
        <a href=""><b>Más</b></a>
      </ion-col>
    </ion-row>
    <div style="height:1px; background-color:#ccc; width:100%; margin:10px 0;"></div>

    <ion-row>
      <ion-col *ngFor="let manga of favoritos?.slice(0,6)" size="6" size-lg="2">
        <a [routerLink]="['/manga', manga.id]">
          <ion-card>
            <img [src]="manga.cover_url" />
          </ion-card>
        </a>
      </ion-col>
    </ion-row>
