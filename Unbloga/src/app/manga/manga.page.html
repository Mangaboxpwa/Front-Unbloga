<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/tab1"></ion-back-button>
    </ion-buttons>
    <ion-title>{{this.manga?.title}}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-grid style="margin-left: 10%; margin-right: 10%; margin-bottom:20%">
    <ion-row>
      <!-- Columna imagen -->
      <ion-col size="12" size-lg="3">
        <ion-card style="text-align: center;">
          <img [src]="this.manga?.cover_url" alt="Portada del manga" />
        </ion-card>
      </ion-col>

      <!-- Columna info -->
      <ion-col size="12" size-lg="6">
        <h1>{{this.manga?.title}}</h1>
        <p>{{this.manga?.publication_date}} - Hecho por {{this.authors}}</p>
        <p>
          {{this.manga?.description}}
        </p>
      </ion-col>

      <!-- Columna derecha -->
      <ion-col size="12" size-lg="3">
        <ion-card>
          <ion-list>
            <ion-item button (click)="darLike()" lines="none" class="like-item" disabled>
              <div class="like-content">
                <i *ngIf="like" class="bi bi-heart-fill"></i>
                <i *ngIf="!like" class="bi bi-heart"></i>
                <span>Like</span>
              </div>
            </ion-item>
            <ion-item-divider class="custom-divider"></ion-item-divider>
            <ion-item lines="none" class="ion-text-center" disabled>
              <div class="rating-content">
                <ion-label>Calificación</ion-label>
                <app-star-rate 
                  [selected]="rating" 
                  (selectedChange)="onRatingChanged($event)">
                </app-star-rate>
              </div>
            </ion-item>
            <ion-item-divider class="custom-divider"></ion-item-divider>
            <ion-item (click)="irReview()" button lines="none" class="ion-text-center">
              <ion-label>Agregar reseña</ion-label>
            </ion-item>
            <ion-item-divider class="custom-divider"></ion-item-divider>
            <ion-item button id="open-toast" (click)="copiarEnlace()" lines="none" class="ion-text-center">
              <ion-label fill="clear">Compartir</ion-label>
                <ion-toast trigger="open-toast" message="Enlace copiado" [duration]="3000"></ion-toast>
            </ion-item>
          </ion-list>
        </ion-card>
      </ion-col>
    </ion-row>

    <!-- Reviews -->
    <ion-row>
      <ion-col size="12">
        <h3>Reviews populares</h3>
        <ion-item-divider class="custom-divider"></ion-item-divider>

        <ion-item [routerLink]="['/user-profile/', review.user_id]" lines="none" *ngFor="let review of reviews?.slice(0,3)" size="12" size-lg="12">
          
          <ion-avatar slot="start">
            <img [src]="review.users.avatar_url" />
          </ion-avatar>
          <ion-label>
            <h2>Reseña por {{review.users.name}}</h2><app-rating [rating]="review.rating"></app-rating><i *ngIf="review.is_favorite" class="bi bi-heart-fill"></i>
            <p><b>{{review.review}}</b></p>
            <!-- <p><i class="bi bi-heart-fill"></i> 1999 likes</p> -->
          </ion-label>
          
        </ion-item>
        <ion-item-divider class="custom-divider"></ion-item-divider>
        <h4 style="text-align: center;">Todas las reviews</h4>
      </ion-col>
      <ion-item-divider class="custom-divider"></ion-item-divider>
    </ion-row>
  </ion-grid>
</ion-content>
