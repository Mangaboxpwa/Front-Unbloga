name: Despliegue de Angular (Build Remoto SSH)

on:
  push:
    branches:
      - main # Se activa al hacer push a la rama 'main'
  
  workflow_dispatch: # Permite ejecutar el workflow manualmente desde GitHub

jobs:
  deploy_angular:
    runs-on: ubuntu-latest
    name: Deploy Angular Project

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # Necesario para obtener el branch y metadata

      - name: Execute remote ssh commands (Build & Deploy)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}

          # Este script se ejecuta COMPLETAMENTE en tu servidor Rocky Linux
          script: |
            echo "== Accediendo al directorio del proyecto =="
            # WORK_DIR = /var/www/mangabox/Front-Angular/Unbloga (Directorio que también sirve Nginx)
            cd ${{ secrets.WORK_DIR }}
            
            # --- FASE 1: Limpieza de Git y Actualización de Código ---
            
            # 1. SOLUCIÓN de propiedad: Añade el directorio como seguro para el usuario SSH
            git config --global --add safe.directory "${{ secrets.WORK_DIR }}"

            echo "== Limpiando y Actualizando código de Git =="
            
            # 2. LIMPIEZA CLAVE: Desecha CUALQUIER cambio local (soluciona el error "local changes would be overwritten").
            git reset --hard origin/main
            
            # 3. Elimina archivos no rastreados por Git
            git clean -f -d
            
            # 4. Realiza la actualización final de código
            git pull

            # --- FASE 2: Instalación y Construcción (Build) ---

            echo "== Instalando dependencias de Node.js =="
            # Borramos la carpeta node_modules vieja antes de instalar, para asegurar una limpieza total.
            rm -rf node_modules
            npm install --legacy-peer-deps

            echo "== Construyendo Angular para Producción =="
            # El resultado se guarda en la carpeta temporal 'www/' (según tu log de Ionic/Capacitor)
            npm run build --prod

            # --- FASE 3: Despliegue y Limpieza Final ---

            echo "== Desplegando la nueva versión =="
            
            # 1. CORRECCIÓN: Mueve el contenido de la carpeta 'www' a la raíz del proyecto ('.').
            # 'www' es la carpeta de salida real de tu build.
            mv www/* .
            
            # 2. Limpia la carpeta temporal 'www' que ya no es necesaria.
            rm -rf www
            
            # 3. Limpia node_modules, ya que solo es necesario para el build.
            rm -rf node_modules 

            echo "== Reiniciando Nginx (si es necesario) =="
            sudo systemctl restart nginx
            
            echo "== Deploy completado correctamente =="