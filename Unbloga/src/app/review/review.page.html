<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button fill="clear" (click)="goBack()">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Review</ion-title>
    <ion-progress-bar *ngIf="btnUndefined" type="indeterminate"></ion-progress-bar>
    <ion-buttons slot="end">
      <ion-button [disabled]="btnUndefined" (click)="guardar()">
        <i class="bi bi-check2"></i>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>


<ion-content [fullscreen]="true">
  <ion-card>
  <ion-card-content>
    <ion-list>
      <ion-item>
        <ion-thumbnail slot="start">
          <img alt="Silhouette of mountains" [src]="this.manga?.cover_url" />
        </ion-thumbnail>
        <ion-label>{{this.manga?.title}}</ion-label>
      </ion-item>

      <!-- <ion-item>
        
        <ion-label>Date</ion-label>
      </ion-item> -->
      <ion-item>
        
        <div class="rating-content">
          <app-star-rate 
            [selected]="rating" 
            (selectedChange)="onRatingChanged($event)">
          </app-star-rate>
          <ion-item button (click)="darLike()" lines="none" class="like-item">
              <div class="like-content">
                <i *ngIf="like" class="bi bi-heart-fill"></i>
                <i *ngIf="!like" class="bi bi-heart"></i>
                <span>Like</span>
              </div>
            </ion-item>
        </div>
      </ion-item>

      <ion-item>

  <!-- PRIMERO en el HTML, PERO alineado a la derecha -->
   <ion-button (click)="microfono()" name="mic-outline"
    slot="end" class="mic-icon" fill="clear">
    <i *ngIf="microfono_estado"  class=" bi bi-mic"></i>
    <i *ngIf="!microfono_estado" class="bi bi-stop-fill"></i>
  </ion-button>

  <form [formGroup]="ReviewForm" style="width: 100%;">
    <ion-textarea
      formControlName="review"
      style="height: 100px;"
      label="Comentario"
      labelPlacement="floating"
      placeholder="Agrega una review">
    </ion-textarea>
  </form>

</ion-item>

    </ion-list>
  </ion-card-content>
</ion-card>
<ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
  <ion-refresher-content></ion-refresher-content>
</ion-refresher>
</ion-content>
