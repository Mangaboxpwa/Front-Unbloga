<ion-header>
  <ion-toolbar>
    <ion-segment value="first">
      <ion-segment-button (click)="stopScanner()" value="first" content-id="first">
        <ion-icon color="medium" name="book"></ion-icon>
      </ion-segment-button>
      <ion-segment-button value="second" content-id="second" (click)="toggleScanner()">
        <ion-icon color="medium" name="scan"></ion-icon>
      </ion-segment-button>
    </ion-segment>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">



<ion-segment-view>
  <ion-segment-content id="first">
      <div style="display: flex; align-items: center; padding: 0 10px;">
    <ion-searchbar
      style="flex: 1;"
      [debounce]="500"
      placeholder="Buscar manga..."
      (ionInput)="handleInput($event)">
    </ion-searchbar>
  </div>

  <ion-list>
    @for (result of results; track result) {
      <ion-item (click)="verDetalle(result.id)">
        <ion-label>{{ result.title }}</ion-label>
      </ion-item>
    }
    <ion-item *ngIf="isEmpty" [routerLink]="['/proposal']">
      <ion-label>¿No encuentras tu manga? Sugierenoslo</ion-label>
    </ion-item>
  </ion-list>
  </ion-segment-content>
  
  <ion-segment-content id="second">
    <video id="video" width="100%" height="100%"></video>
  </ion-segment-content>

</ion-segment-view>


  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

</ion-content>
