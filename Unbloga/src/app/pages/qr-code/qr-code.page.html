<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Código QR de {{User?.name}}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div style="text-align: center; margin-top: 20px;">
    <qrcode 
  [qrdata]="myAngularxQrCode" 
  [width]="256" 
  [imageSrc]="User?.avatar_url"
  [imageHeight]="80"
  [imageWidth]="80"
  [colorDark]="'#67568Cff'"
  [cssClass]="'center'"
  [errorCorrectionLevel]="'M'">
</qrcode>


  </div>
</ion-content>
