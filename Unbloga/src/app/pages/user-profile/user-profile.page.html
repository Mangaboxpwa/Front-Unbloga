<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>{{User?.name}}</ion-title>
    <ion-buttons slot="start">
      <ion-back-button (click)="goBack()"></ion-back-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <ion-button id="open-action-sheet">
        <i class="bi bi-share-fill"></i>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-list>
  <ion-item >
    <div class="avatar-wrapper">
      <ion-avatar>
        <img alt="Silhouette of a person's head" [src]="User?.avatar_url" />
      </ion-avatar>
      <ion-button (click)="follow()" *ngIf="!User?.is_following  && isLoggedIn" fill="outline" color="medium">Seguir</ion-button>
      <ion-button (click)="unfollow()" *ngIf="User?.is_following && isLoggedIn" fill="outline" color="success">Dejar de seguir</ion-button>
    </div>
  </ion-item>
  <!-- Favoritos -->
  <ion-item>
    <ion-label position="stacked">
    <h1 class="title">Favoritos</h1>
  </ion-label>
    <ion-row class="tight-row" style="width: 100%;">
      <ion-col *ngFor="let favorite of Favorites?.slice(0,4)"  size="3" size-lg="3">
        <a [routerLink]="['/manga', favorite.manga.id]">
        <ion-card>
          <img [src]="favorite.manga.cover_url" />
        </ion-card>
        </a>
      </ion-col>
    </ion-row>
  </ion-item>
  <!-- Reseñas recientes -->
  <ion-item>
    <ion-label position="stacked">
    <h1 class="title">Actividad reciente</h1>
  </ion-label>
    <ion-row class="tight-row" style="width: 100%;">
      <ion-col *ngFor="let review of Reviews?.slice(0,4)"  size="3" size-lg="3">
        <a [routerLink]="['/manga', review.manga.id]">
        <ion-card>
          <img [src]="review.manga.cover_url" />
        </ion-card>
        </a>
      </ion-col>
    </ion-row>
  </ion-item>
<!-- Tercera sección -->
<ion-list lines="none">

  <ion-item button [routerLink]="['/reviews/',this.id]">
    <ion-label>Reviews</ion-label>

    <ion-badge slot="end" color="none">{{Reviews?.length}}</ion-badge>
    <i class="bi bi-chevron-right" slot="end"></i>
  </ion-item>

  <ion-item button [routerLink]="['/favorites/',this.id]">
    <ion-label>Favoritos</ion-label>

    <ion-badge slot="end" color="none">{{this.Favorites?.length}}</ion-badge>
    <i class="bi bi-chevron-right" slot="end"></i>
  </ion-item>

  <ion-item button (click)="irNetwork()">
    <ion-label>Siguiendo</ion-label>

    <ion-badge slot="end" color="none">{{this.User?.following?.length}}</ion-badge>
    <i class="bi bi-chevron-right" slot="end"></i>
  </ion-item>

  <ion-item button (click)="irNetwork()">
    <ion-label>Seguidores</ion-label>

    <ion-badge slot="end" color="none">{{this.User?.followers?.length}}</ion-badge>
    <i class="bi bi-chevron-right" slot="end"></i>
  </ion-item>

</ion-list>



</ion-list>
<ion-action-sheet
trigger="open-action-sheet"  
[header]="User?.name"
  [buttons]="actionSheetButtons"
></ion-action-sheet>
<ion-toast trigger="open-toast" message="Enlace copiado" [duration]="3000"></ion-toast>
<ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
  <ion-refresher-content></ion-refresher-content>
</ion-refresher>
<ion-alert
          [isOpen]="isAlertOpen"
          [header]="headerAlert"
          [subHeader]="subHeader"
          [message]="message"
          [buttons]="alertButtons"
          (didDismiss)="setOpen(false)"
        ></ion-alert>
</ion-content>
