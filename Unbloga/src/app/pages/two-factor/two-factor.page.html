<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button fill="clear" (click)="goBack()">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>
      Segundo factor
    </ion-title>
    <ion-progress-bar *ngIf="btnUndefined" type="indeterminate"></ion-progress-bar>
  </ion-toolbar>
</ion-header>

<ion-content>
<ng-container>
  <div class="container"style="margin: 0;
  padding: 0;">
    
    <!-- Arriba: Imagen de fondo -->
    <div class="top-section" ></div>

    <!-- Abajo: dividido en 3 partes -->
    <div class="bottom-section">
      
      <!-- Sección 1: Imagen centrada -->
      <div class="topp-section">
        <h1>Segunda autenticación</h1>
      </div>

      <!-- Sección 2: Botones -->
      <div class="middle-section">
        <form class="formulario" [formGroup]="twoFactorForm">
          <ion-item style="width: 100%; margin-bottom:5px">
            <ion-input label="Código" helperText="Revisa el código en tu correo" type="number" formControlName="code" labelPlacement="floating" placeholder=""></ion-input>
          </ion-item>
          <ion-note *ngIf="backendErrors?.code?.[0]" slot="error" color="danger">
            {{ backendErrors?.code?.[0] }}
          </ion-note>
          <ion-note *ngIf="codigo_mal" slot="error" color="danger">
            {{codigo_mal}}
          </ion-note>
          <div *ngIf="!codigo_mal && !backendErrors?.code?.[0] && twoFactorForm.get('code')?.touched && twoFactorForm.get('code')?.errors?.['required']">
            <small style="color:red">El código es obligatorio.</small>
          </div>
          <div *ngIf="!codigo_mal && !backendErrors?.code?.[0] && twoFactorForm.get('code')?.touched && twoFactorForm.get('code')?.errors?.['minlength']">
            <small style="color:red">Minimo 6 digitos.</small>
          </div>
          <div class="button-row">
            <!-- <ion-button shape="round" [disabled]="contador > 0" (click)="iniciarContador()">
              {{ contador > 0 ? 'Reenviar código (' + contador + 's)' : 'Reenviar código' }}
            </ion-button> -->
            <ion-button shape="round" [disabled]="btnUndefined" (click)="enviarTwoFactor()">Ir</ion-button>
          </div>
        </form>
        <hr />
      </div>
      <ion-alert
          [isOpen]="isAlertOpen"
          [header]="headerAlert"
          [subHeader]="subHeader"
          [message]="message"
          [buttons]="alertButtons"
          (didDismiss)="setOpen(false)"
        ></ion-alert>
      <!-- Sección 3: Label -->
      <div class="bottomm-section">
        <label>Artwork from Vagabond</label>
      </div>
      
    </div>
  </div>
</ng-container>

</ion-content>
