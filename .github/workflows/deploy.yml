name: Despliegue de Angular (Build Remoto SSH)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy_angular:
    runs-on: ubuntu-latest
    name: Deploy Angular Project

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute remote ssh commands (Build & Deploy)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            echo "== Accediendo al directorio del proyecto =="
            cd ${{ secrets.WORK_DIR }}

            # --- FASE 1: Git: Guardar cambios locales y actualizar ---
            git config --global --add safe.directory "${{ secrets.WORK_DIR }}"

            echo "== Guardando cambios locales (si hay) =="
            sudo git stash push -m "Cambios locales antes de pull"

            echo "== Actualizando código del repositorio =="
            sudo git pull origin main --rebase

            echo "== Aplicando cambios locales de nuevo =="
            sudo git stash pop || echo "No hay cambios locales para reaplicar"

            # --- FASE 2: Instalación y Build ---
            echo "== Instalando dependencias de Node.js =="
            sudo rm -rf node_modules
            sudo npm install --legacy-peer-deps

            echo "== Limpiando carpeta www existente =="
            sudo rm -rf www

            echo "== Construyendo Angular para Producción =="
            sudo npm run build --prod

            # --- FASE 3: Permisos y reinicio de Nginx ---
            echo "== Corrigiendo permisos para Nginx =="
            sudo chown -R nginx:nginx ${{ secrets.WORK_DIR }}
            sudo chmod -R 755 ${{ secrets.WORK_DIR }}
            sudo chcon -Rt httpd_sys_content_t ${{ secrets.WORK_DIR }}

            echo "== Reiniciando Nginx =="
            sudo systemctl restart nginx

            echo "== Deploy completado correctamente =="
