<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button fill="clear" (click)="goBack()">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>
      Nueva contraseña
    </ion-title>
    <ion-progress-bar *ngIf="btnUndefined" type="indeterminate"></ion-progress-bar>
  </ion-toolbar>
</ion-header>

<ion-content>
<ng-container>
  <div class="container"style="margin: 0;
  padding: 0;">
    
    <!-- Arriba: Imagen de fondo -->
    <div class="top-section" ></div>

    <!-- Abajo: dividido en 3 partes -->
    <div class="bottom-section">
      
      <!-- Sección 1: Imagen centrada -->
      <div class="topp-section">
        <h1>Cambia tu contraseña</h1>
      </div>

      <!-- Sección 2: Botones -->
      <div class="middle-section" >

        <form class="formulario" [formGroup]="nuevaContrasenaForm">
        <ion-item style="width: 100%; margin-bottom:5px">
          <ion-input type="password" formControlName="password"  label="Contraseña nueva" labelPlacement="floating"></ion-input>
        </ion-item>
        <div *ngIf="nuevaContrasenaForm.get('password')?.touched && nuevaContrasenaForm.get('password')?.errors?.['required']">
          <small style="color:red">La contraseña es obligatoria.</small>
        </div>
        <div *ngIf="nuevaContrasenaForm.get('password')?.touched && nuevaContrasenaForm.get('password')?.errors?.['minlength']">
          <small style="color:red">Minimo ingresa 8 carácteres, una minúscula, mayúscula y numero.</small>
        </div>
        <ion-item style="width: 100%;">
          <ion-input type="password" formControlName="password_confirmation"  label="Repetir contraseña" labelPlacement="floating"></ion-input>
        </ion-item> 
        <div *ngIf="nuevaContrasenaForm.get('password_confirmation')?.touched && nuevaContrasenaForm.get('password_confirmation')?.errors?.['required']">
          <small style="color:red">Campo obligatorio.</small>
        </div>
        <ion-note *ngIf="backendErrors?.password?.[0]" slot="error" color="danger">
          {{ backendErrors?.password?.[0] }}
        </ion-note>
        
        <div class="button-row">
          <ion-button [disabled]="btnUndefined" shape="round"(click)="enviarContrasenasNuevas()">Ir</ion-button>
        </div>
        <ion-alert
          [isOpen]="isAlertOpen"
          [header]="headerAlert"
          [subHeader]="subHeader"
          [message]="message"
          [buttons]="alertButtons"
          (didDismiss)="setOpen(false)"
        ></ion-alert>
       
        <hr />
        </form>
      </div>

      <!-- Sección 3: Label -->
      <div class="bottomm-section">
        <label>Artwork from Vagabond</label>
      </div>
      
    </div>
  </div>
</ng-container>
</ion-content>
