<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button (click)="goBack()"></ion-back-button>
    </ion-buttons>
    <ion-title>
      Register
    </ion-title>
    <ion-progress-bar *ngIf="btnUndefined" type="indeterminate"></ion-progress-bar>
  </ion-toolbar>
</ion-header>

<ion-content>
<ng-container>
  <div class="container"style="margin: 0;
  padding: 0;">
    
    <!-- Arriba: Imagen de fondo -->
    <div class="top-section" ></div>

    <!-- Abajo: dividido en 3 partes -->
    <div class="bottom-section">
      
      <!-- Sección 1: Imagen centrada -->
      <div class="topp-section">
        <h1>Unete a Unbloga</h1>
      </div>

      <!-- Sección 2: Botones -->
      <div class="middle-section" >

        <form class="formulario" [formGroup]="RegistrarForm">
        <ion-item style="width: 100%; margin-bottom:5px">
          <ion-input label="Correo" formControlName="email" labelPlacement="floating" placeholder=""></ion-input>
        </ion-item>
        <ion-item style="width: 100%; margin-bottom:5px">
          <ion-input label="Nombre" formControlName="name"  labelPlacement="floating" placeholder=""></ion-input>
        </ion-item>
        <ion-item style="width: 100%; margin-bottom:5px">
          <ion-input type="password" formControlName="password"  label="Contraseña" labelPlacement="floating"></ion-input>
        </ion-item>
        <ion-item style="width: 100%;">
          <ion-input type="password" formControlName="password_confirmation"  label="Repetir contraseña" labelPlacement="floating"></ion-input>
        </ion-item> 
        
        <div class="button-row">
          <ion-button shape="round" (click)="goLogin()">Inicia sesión</ion-button>
          <ion-button shape="round" [disabled]="btnUndefined" (click)="enviarRegistro()">Ir</ion-button>
        </div>
        <ion-alert
          [isOpen]="isAlertOpen"
          [header]="headerAlert"
          [subHeader]="subHeader"
          [message]="message"
          [buttons]="alertButtons"
          (didDismiss)="setOpen(false)"
        ></ion-alert>
       
        <hr />
        </form>
      </div>

      <!-- Sección 3: Label -->
      <div class="bottomm-section">
        <label>Artwork from Vagabond</label>
      </div>
      
    </div>
  </div>
</ng-container>

</ion-content>
