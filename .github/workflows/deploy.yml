name: Despliegue de Angular (Build Remoto SSH con git pull)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy_angular:
    runs-on: ubuntu-latest
    name: Deploy Angular Project

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Ejecutar comandos SSH para Build & Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            echo "== Accediendo al directorio del proyecto =="
            cd ${{ secrets.WORK_DIR }}

            git config --global --add safe.directory "${{ secrets.WORK_DIR }}"

            echo "== Descargando últimos cambios del repositorio =="
            sudo git fetch origin main
            sudo git reset --hard origin/main

            echo "== Instalando dependencias de Node.js =="
            rm -rf node_modules
            npm install --legacy-peer-deps

            echo "== Instalando Ionic CLI =="
            npm install -g @ionic/cli

            echo "== Limpiando carpeta www existente =="
            rm -rf www

            echo "== Construyendo Angular para producción =="
            ionic build --prod

            echo "== Ajustando permisos para que nginx pueda leer =="
            # Permisos correctos: lectura para todos, escritura solo para israel
            sudo chmod -R 755 ${{ secrets.WORK_DIR }}

            # SELinux: necesario en Rocky Linux / AlmaLinux / CentOS
            sudo chcon -Rt httpd_sys_content_t ${{ secrets.WORK_DIR }}

            echo "== Reiniciando Nginx =="
            sudo systemctl restart nginx

            echo "== Deploy completado correctamente =="
