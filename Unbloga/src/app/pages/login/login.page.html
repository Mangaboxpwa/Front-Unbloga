<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Login
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
<ng-container>
  <div class="container"style="margin: 0;
  padding: 0;">
    
    <!-- Arriba: Imagen de fondo -->
    <div class="top-section" ></div>

    <!-- Abajo: dividido en 3 partes -->
    <div class="bottom-section">
      
      <!-- Sección 1: Imagen centrada -->
      <div class="topp-section">
        <h1>Inicia sesión</h1>
      </div>

      <!-- Sección 2: Botones -->
      <div class="middle-section" >
        <ion-item style="width: 100%; margin-bottom:5px">
          <ion-input label="Username" labelPlacement="floating" placeholder=""></ion-input>
        </ion-item>
        <ion-item style="width: 100%;">
          <ion-input  label="Contraseña" labelPlacement="floating"></ion-input>
        </ion-item>        
        <hr />
      </div>

      <!-- Sección 3: Label -->
      <div class="bottomm-section">
        <label>Artwork from Vagabond</label>
      </div>
      
    </div>
  </div>
</ng-container>

</ion-content>
